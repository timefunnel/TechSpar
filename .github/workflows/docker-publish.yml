name: Publish production container images

on:
  push:
    branches:
      - codex/local-dev

permissions:
  contents: read
  packages: write

concurrency:
  group: techspar-containers-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            dockerfile: apps/api/Dockerfile
            image: techspar-backend
          - service: frontend
            dockerfile: frontend/Dockerfile
            image: techspar-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Validate exact source revision
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'invalid source SHA: %s\n' "$GITHUB_SHA" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0
          cache-from: type=gha,scope=techspar-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=techspar-${{ matrix.service }}
          provenance: mode=max

      - name: Record immutable image reference
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}"
          printf 'IMAGE_REFERENCE=%s@%s\n' "$image" '${{ steps.build.outputs.digest }}'
          printf '### %s\n\n`%s@%s`\n' '${{ matrix.service }}' "$image" '${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
